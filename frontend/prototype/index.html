<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>实习决策与执行工作台 · 前端原型</title>
<meta name="description" content="实习决策与执行工作台的前端原型：画像与证据、岗位、匹配与组合、两周计划、投递跟踪、管理员与同步中心。演示站使用虚构资料，仅展示前端框架与交互，不连接后端。" />
<style>
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

:root {
  --bg: #ffffff;
  --surface: #f5f5f7;
  --surface-warm: #fbfbfd;

  --fg: #1d1d1f;
  --fg-2: #424245;
  --muted: #6e6e73;
  --meta: #86868b;

  --border: #d2d2d7;
  --border-soft: #e8e8ed;

  --accent: #0071e3;
  --accent-on: #ffffff;
  --accent-hover: #0077ed;
  --accent-active: #0066cc;

  --success: #16a34a;
  --warn:    #eab308;
  --danger:  #dc2626;

  /* 字体栈保留 token 名，追加中文字体回退 */
  --font-display:
    "SF Pro Display", "SF Pro Icons", -apple-system, BlinkMacSystemFont,
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body:
    "SF Pro Text", "SF Pro Icons", -apple-system, BlinkMacSystemFont,
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono:
    "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;

  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 17px;
  --text-lg:   21px;
  --text-xl:   28px;
  --text-2xl:  40px;
  --text-3xl:  56px;
  --text-4xl:  80px;

  --leading-body:  1.47;
  --leading-tight: 1.05;

  --tracking-display: -0.015em;

  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  --section-y-desktop: 100px;
  --section-y-tablet:  64px;
  --section-y-phone:   40px;

  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   18px;
  --radius-pill: 980px;

  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: 0 12px 32px rgba(0, 0, 0, 0.08);
  --elev-pop:    0 10px 30px rgba(0, 0, 0, 0.14);
  --elev-thumb:  0 1px 3px rgba(0, 0, 0, 0.18);

  --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 65%);

  --motion-fast:   150ms;
  --motion-base:   220ms;
  --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);

  --container-max:            1024px;
  --container-gutter-desktop: 22px;
  --container-gutter-tablet:  18px;
  --container-gutter-phone:   16px;

  /* 原型应用维度 */
  --sidebar-w:   244px;
  --topbar-h:    56px;
  --content-max: 1180px;
  --scrim:       rgba(0, 0, 0, 0.45);
  --warn-bg:     color-mix(in oklab, var(--warn), var(--bg) 90%);
  --danger-bg:   color-mix(in oklab, var(--danger), var(--bg) 92%);
  --success-bg:  color-mix(in oklab, var(--success), var(--bg) 92%);
  --accent-soft: color-mix(in oklab, var(--accent), var(--bg) 92%);
  --accent-ink:  var(--accent-active);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--surface);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.62;
  font-weight: 400;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
table { border-collapse: collapse; width: 100%; }
[hidden] { display: none !important; }
:focus-visible {
  outline: 3px solid color-mix(in oklab, var(--accent), transparent 52%);
  outline-offset: 2px;
  border-radius: 6px;
}
.ic {
  width: 18px; height: 18px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
  overflow: visible;
}
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; }

.eyebrow {
  font-family: var(--font-display); font-size: var(--text-xs); font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-ink);
}
.hint { font-size: 12px; color: var(--meta); line-height: 1.55; }
.muted { color: var(--muted); }
.small { font-size: var(--text-sm); }
.up { color: var(--success); }
.down { color: var(--danger); }

.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin: 6px 0 20px;
}
.page-head h1 {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(24px, 2.5vw, 32px); line-height: 1.16;
  letter-spacing: var(--tracking-display);
}
.page-head .lead { color: var(--muted); font-size: var(--text-sm); margin-top: 5px; max-width: 62ch; }
.head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.stack-cards { display: flex; flex-direction: column; gap: 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.split-even { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 1080px) {
  .split, .split-even { grid-template-columns: minmax(0, 1fr); }
}
/* ─── App shell ─────────────────────────────────────────────────── */
.app { min-height: 100vh; }

.sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: 40;
  width: var(--sidebar-w);
  display: flex; flex-direction: column;
  background: var(--bg);
  border-right: 1px solid var(--border-soft);
  padding: 18px 12px 14px;
}
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--fg); color: var(--bg);
}
.brand-mark .ic { width: 20px; height: 20px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text strong { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.brand-text span { font-size: 11px; color: var(--meta); }
.side-nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; min-height: 0; }
.side-group { font-size: 11px; color: var(--meta); padding: 14px 10px 6px; letter-spacing: 0.04em; }
.side-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px;
  font-size: var(--text-sm); color: var(--fg-2);
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.side-item:hover { background: var(--surface); text-decoration: none; }
.side-item .ic { width: 17px; height: 17px; color: var(--meta); transition: color var(--motion-fast) var(--ease-standard); }
.side-item.active { background: var(--surface); color: var(--fg); font-weight: 600; }
.side-item.active .ic { color: var(--accent); }
.side-badge {
  margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: var(--radius-pill); background: var(--danger); color: var(--accent-on);
  font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;
}
.side-foot { padding-top: 12px; }
.sync-card {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 12px;
  background: var(--surface); font-size: 12px; color: var(--muted);
}
.sync-card .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
.sync-card.busy .dot { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.sync-card.bad .dot { background: var(--danger); }
@keyframes pulse { 50% { opacity: 0.35; } }

.main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: var(--topbar-h);
  padding: 8px 24px;
  background: color-mix(in oklab, var(--bg), transparent 18%);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter:         saturate(180%) blur(20px);
  border-bottom: 1px solid color-mix(in oklab, var(--border-soft), transparent 40%);
}
.topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.topbar-right { display: flex; align-items: center; gap: 6px; position: relative; }
.brand-inline { display: none; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg-2);
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.icon-btn:hover { background: var(--surface); }
.icon-btn .dot {
  position: absolute; top: 7px; right: 8px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--accent); border: 2px solid var(--bg);
}
.avatar-btn { border-radius: 50%; display: inline-flex; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent-ink);
  font-size: var(--text-sm); font-weight: 600; user-select: none;
}
.avatar-lg { width: 44px; height: 44px; font-size: var(--text-base); }

.popover {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 70;
  width: min(330px, calc(100vw - 32px));
  background: var(--bg); border: 1px solid var(--border-soft);
  border-radius: var(--radius-md); box-shadow: var(--elev-pop);
  padding: 8px; animation: popIn 180ms var(--ease-standard);
}
@keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
.pop-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 8px; }
.pop-head strong { font-size: var(--text-sm); }
.pop-item {
  display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
  padding: 9px 10px; border-radius: 9px; font-size: var(--text-sm); color: var(--fg-2); line-height: 1.5;
}
.pop-item:hover { background: var(--surface); }
.pop-item .ic { width: 16px; height: 16px; margin-top: 3px; color: var(--meta); flex: none; }
.pop-item.danger { color: var(--danger); }
.pop-item.danger .ic { color: var(--danger); }
.pop-sep { height: 1px; background: var(--border-soft); margin: 6px 4px; }
.pop-note { padding: 6px 10px 4px; font-size: 12px; color: var(--meta); line-height: 1.5; }
.pop-item .po-sub { display: block; font-size: 12px; color: var(--meta); margin-top: 1px; }

.view {
  flex: 1; width: 100%; max-width: var(--content-max);
  margin-inline: auto;
  padding: 20px 24px 72px;
}
.view:focus { outline: none; }

.boot { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 120px 0; color: var(--muted); font-size: var(--text-sm); }
.boot-mark { width: 44px; height: 44px; border-radius: 13px; background: var(--fg); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.boot .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--border); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  display: none; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in oklab, var(--bg), transparent 12%);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter:         saturate(180%) blur(20px);
  border-top: 1px solid var(--border-soft);
  padding-bottom: env(safe-area-inset-bottom);
}
.bn-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 0 7px; font-size: 11px; color: var(--muted);
  min-height: 52px;
}
.bn-item .ic { width: 21px; height: 21px; }
.bn-item.active { color: var(--accent-ink); font-weight: 600; }
.bn-item:hover { text-decoration: none; }

@media (max-width: 1023px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .bottom-nav { display: grid; }
  .brand-inline { display: inline; }
  .view { padding: 16px 16px 108px; }
  .topbar { padding: 8px 16px; }
}
@media (max-width: 560px) { .brand-inline { display: none; } }

/* ─── Cards ─────────────────────────────────────────────────────── */
.card {
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 18px;
}
.card.pad-lg { padding: 24px; }
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
}
.card-title { font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; letter-spacing: -0.01em; }
.card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.divider { height: 1px; background: var(--border-soft); margin: 14px 0; border: 0; }

/* ─── Buttons ───────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 15px; border: 1px solid transparent; border-radius: var(--radius-sm);
  font-size: var(--text-sm); font-weight: 500; line-height: 1.2;
  text-decoration: none; white-space: nowrap;
  transition: background-color var(--motion-fast) var(--ease-standard),
              border-color    var(--motion-fast) var(--ease-standard),
              color           var(--motion-fast) var(--ease-standard),
              transform       var(--motion-fast) var(--ease-standard),
              box-shadow      var(--motion-fast) var(--ease-standard);
}
.btn:hover { text-decoration: none; }
.btn:active { transform: scale(0.98); }
.btn .ic { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); color: var(--accent-on); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg); color: var(--fg); border-color: var(--border); }
.btn-secondary:hover { background: var(--surface); border-color: var(--meta); }
.btn-quiet { background: transparent; color: var(--accent-ink); }
.btn-quiet:hover { background: var(--accent-soft); }
.btn-danger { background: var(--danger); color: var(--accent-on); }
.btn-danger:hover { background: color-mix(in oklab, var(--danger), #000 12%); }
.btn-danger-quiet { background: transparent; color: var(--danger); }
.btn-danger-quiet:hover { background: var(--danger-bg); }
.btn-sm { padding: 5px 11px; font-size: 13px; }
.btn-pill { border-radius: var(--radius-pill); padding: 11px 22px; font-size: var(--text-base); }
.btn-pill-sm { border-radius: var(--radius-pill); padding: 8px 16px; font-size: var(--text-sm); }
.btn[disabled], .btn.disabled { opacity: 0.45; pointer-events: none; }

/* ─── Chips / badges / tags ─────────────────────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 500; line-height: 1.5; white-space: nowrap;
  background: var(--surface); color: var(--fg-2);
}
.chip .ic { width: 13px; height: 13px; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.chip-accent  { background: var(--accent-soft);  color: var(--accent-ink); }
.chip-success { background: var(--success-bg);   color: var(--success); }
.chip-warn    { background: var(--warn-bg);      color: color-mix(in oklab, var(--warn), #000 34%); }
.chip-danger  { background: var(--danger-bg);    color: var(--danger); }
.chip-muted   { background: var(--surface);      color: var(--muted); }
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 7px;
  background: var(--surface-warm); border: 1px solid var(--border-soft);
  color: var(--fg-2); font-size: 12px; white-space: nowrap;
}
/* ─── Rows / lists ──────────────────────────────────────────────── */
.rowlist { display: flex; flex-direction: column; }
.rowitem {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 2px; border-bottom: 1px solid var(--border-soft);
}
.rowitem:last-child { border-bottom: 0; padding-bottom: 2px; }
.rowitem:first-child { padding-top: 4px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.45; }
.row-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.row-side { flex: none; display: flex; align-items: center; gap: 6px; }

/* ─── Logo tiles ────────────────────────────────────────────────── */
.logo {
  width: 40px; height: 40px; flex: none; overflow: hidden;
  border-radius: 10px; border: 1px solid var(--border-soft);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.logo .mono { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--fg-2); }
.logo-lg { width: 56px; height: 56px; border-radius: 14px; }
.logo-lg .mono { font-size: 22px; }

/* ─── Fields ────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: var(--text-sm); font-weight: 500; color: var(--fg); }
.field .req { color: var(--danger); margin-left: 2px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 10px 13px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--fg); font-size: var(--text-sm);
  line-height: 1.45; outline: none; appearance: none;
  transition: border-color var(--motion-fast) var(--ease-standard),
              box-shadow   var(--motion-fast) var(--ease-standard);
}
.field textarea { min-height: 110px; resize: vertical; }
.field select {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px;
}
.field input::placeholder, .field textarea::placeholder { color: var(--meta); }
.field input:hover, .field textarea:hover, .field select:hover { border-color: var(--meta); }
.field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible { border-color: var(--accent); outline: none; box-shadow: var(--focus-ring); }
.field .err { font-size: 12px; color: var(--danger); display: flex; align-items: center; gap: 5px; }
.field .err .ic { width: 13px; height: 13px; }
.field.bad input, .field.bad textarea, .field.bad select { border-color: var(--danger); }
.field-help { font-size: 12px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .span-2 { grid-column: span 2; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } .form-grid .span-2 { grid-column: auto; } }

/* ─── Switch ────────────────────────────────────────────────────── */
.switch { position: relative; width: 46px; height: 28px; flex: none; display: inline-block; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.switch .trk {
  position: absolute; inset: 0; border-radius: var(--radius-pill);
  background: var(--border); transition: background-color var(--motion-base) var(--ease-standard);
  pointer-events: none;
}
.switch .trk::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--bg); box-shadow: var(--elev-thumb);
  transition: transform var(--motion-base) var(--ease-standard);
}
.switch input:checked + .trk { background: var(--success); }
.switch input:checked + .trk::after { transform: translateX(18px); }
.switch input:focus-visible + .trk { outline: 3px solid color-mix(in oklab, var(--accent), transparent 52%); outline-offset: 2px; }

/* ─── Segmented control ─────────────────────────────────────────── */
.seg {
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: 11px;
}
.seg button {
  padding: 6px 14px; border-radius: 8px;
  font-size: var(--text-sm); color: var(--muted); white-space: nowrap;
  transition: background-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: var(--elev-thumb); }
.seg-mini button { padding: 4px 10px; font-size: 12px; }

/* ─── Toast ─────────────────────────────────────────────────────── */
.toasts {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none; width: min(92vw, 480px);
}
.toast {
  pointer-events: auto;
  display: flex; align-items: flex-start; gap: 9px;
  padding: 11px 16px; border-radius: 14px;
  background: var(--fg); color: var(--bg);
  font-size: var(--text-sm); line-height: 1.5;
  box-shadow: var(--elev-pop);
  animation: toastIn 260ms var(--ease-standard);
  max-width: 100%;
}
.toast.out { animation: toastOut 180ms var(--ease-standard) both; }
.toast .ic { width: 16px; height: 16px; margin-top: 2px; }
.toast .t-ok .ic { color: color-mix(in oklab, var(--success), #fff 42%); }
.toast .t-warn .ic { color: color-mix(in oklab, var(--warn), #fff 20%); }
.toast .t-err .ic { color: color-mix(in oklab, var(--danger), #fff 42%); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px) scale(0.98); } }
@media (max-width: 1023px) { .toasts { bottom: 84px; } }

/* ─── Sheet / modal ─────────────────────────────────────────────── */
.scrim {
  position: fixed; inset: 0; z-index: 100; background: var(--scrim);
  animation: fadeIn 200ms var(--ease-standard);
}
.scrim.out { animation: fadeOut 160ms var(--ease-standard) both; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
.sheet {
  position: fixed; z-index: 101;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 40px)); max-height: 84vh;
  display: flex; flex-direction: column;
  background: var(--bg); border-radius: var(--radius-lg);
  box-shadow: var(--elev-pop);
  animation: sheetIn 260ms var(--ease-standard);
  overflow: hidden;
}
.sheet.out { animation: sheetOut 170ms var(--ease-standard) both; }
.sheet-lg { width: min(780px, calc(100vw - 40px)); }
@keyframes sheetIn { from { opacity: 0; transform: translate(-50%, -47%) scale(0.98); } }
@keyframes sheetOut { to { opacity: 0; transform: translate(-50%, -48%) scale(0.985); } }
.sheet-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 18px 20px 12px; flex: none;
}
.sheet-head h2 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.012em; }
.sheet-head .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.sheet-body { padding: 2px 20px 20px; overflow-y: auto; overscroll-behavior: contain; }
.sheet-foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border-soft); flex: none;
  background: var(--bg);
}
.sheet-close {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--muted);
}
.sheet-close:hover { background: var(--border-soft); color: var(--fg); }
@media (max-width: 640px) {
  .sheet {
    left: 0; right: 0; bottom: 0; top: auto; transform: none;
    width: 100%; max-height: 88vh;
    border-radius: 20px 20px 0 0;
    animation: sheetUp 280ms var(--ease-standard);
  }
  .sheet.out { animation: sheetDown 180ms var(--ease-standard) both; }
  @keyframes sheetUp { from { opacity: 0; transform: translateY(28px); } }
  @keyframes sheetDown { to { opacity: 0; transform: translateY(24px); } }
}

/* ─── Skeleton ──────────────────────────────────────────────────── */
.sk {
  border-radius: 9px;
  background: linear-gradient(90deg, var(--border-soft) 25%, color-mix(in oklab, var(--border-soft), var(--bg) 55%) 42%, var(--border-soft) 63%);
  background-size: 300% 100%;
  animation: shimmer 1.4s ease infinite;
}
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -20% 0; } }
.sk-line { height: 12px; }
.sk-line.w60 { width: 60%; }
.sk-line.w40 { width: 40%; }

/* ─── Empty state ───────────────────────────────────────────────── */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 34px 16px; }
.empty .e-ic {
  width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--muted);
}
.empty .e-ic .ic { width: 22px; height: 22px; }
.empty strong { font-size: var(--text-sm); font-weight: 600; }
.empty p { font-size: 13px; color: var(--muted); max-width: 36ch; }

/* ─── Banner ────────────────────────────────────────────────────── */
.banner {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border-radius: var(--radius-md);
  font-size: 13px; line-height: 1.55; color: var(--fg-2);
  background: var(--surface-warm); border: 1px solid var(--border-soft);
}
.banner .ic { width: 16px; height: 16px; margin-top: 2px; color: var(--muted); }
.banner b { font-weight: 600; }
.banner-warn { background: var(--warn-bg); border-color: color-mix(in oklab, var(--warn), transparent 55%); }
.banner-warn .ic { color: color-mix(in oklab, var(--warn), #000 30%); }
.banner-danger { background: var(--danger-bg); border-color: color-mix(in oklab, var(--danger), transparent 60%); }
.banner-danger .ic { color: var(--danger); }
.banner-success { background: var(--success-bg); border-color: color-mix(in oklab, var(--success), transparent 60%); }
.banner-success .ic { color: var(--success); }

/* ─── Check circle ──────────────────────────────────────────────── */
.tcheck {
  width: 24px; height: 24px; border-radius: 50%; flex: none;
  border: 1.5px solid var(--meta); background: transparent; color: var(--accent-on);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background-color var(--motion-fast) var(--ease-standard),
              border-color var(--motion-fast) var(--ease-standard);
}
.tcheck .ic { width: 13px; height: 13px; opacity: 0; transform: scale(0.6); transition: opacity var(--motion-fast), transform var(--motion-fast) var(--ease-standard); }
.tcheck:hover { border-color: var(--accent); }
.tcheck.done { background: var(--accent); border-color: var(--accent); }
.tcheck.done .ic { opacity: 1; transform: scale(1); }

/* ─── Motion: view + list entrance ──────────────────────────────── */
@media (prefers-reduced-motion: no-preference) {
  .view-enter > * { animation: riseIn 320ms var(--ease-standard) both; animation-delay: calc(var(--i, 0) * 45ms); }
}
@keyframes riseIn { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
/* ─── Stat strip / dashboard ────────────────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat-cell { background: var(--bg); border: 1px solid var(--border-soft); border-radius: 14px; padding: 14px 16px; }
.stat-num { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 3px; }
.stat-num .u { font-size: 14px; font-weight: 500; color: var(--muted); }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 3px; }
.stat-delta { font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
.stat-delta .ic { width: 13px; height: 13px; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 16px; }
@media (max-width: 1080px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } }

/* ─── Ring ──────────────────────────────────────────────────────── */
.ring { display: block; }
.ring-track { stroke: var(--border-soft); }
.ring-val { stroke: var(--accent); }
.ring-num { font-family: var(--font-display); font-size: 26px; font-weight: 600; fill: var(--fg); }
.ring-wrap { display: flex; align-items: center; gap: 18px; }
.ring-side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

/* ─── Meters / chart ────────────────────────────────────────────── */
.meter { display: grid; grid-template-columns: 1fr 132px 40px; gap: 12px; align-items: center; padding: 7px 0; }
.m-label { font-size: 13px; color: var(--fg-2); display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.m-w { font-size: 11px; color: var(--meta); }
.m-track { height: 8px; border-radius: 4px; background: var(--border-soft); overflow: hidden; }
.m-track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.m-val { font-size: 13px; font-weight: 600; text-align: right; }
@media (max-width: 640px) { .meter { grid-template-columns: 1fr 84px 36px; } }
/* ─── 投入统计图表（柱状 / 折线切换版） ─────────────────────────── */
.tchart-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tstats { display: flex; flex-wrap: wrap; gap: 22px; padding: 10px 2px 14px; }
.tstat { display: flex; flex-direction: column; gap: 1px; min-width: 76px; }
.tstat b { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.tstat span { font-size: 11px; color: var(--meta); }
.plot { position: relative; height: 200px; margin-left: 36px; border-bottom: 1px solid var(--border-soft); }
.grid { position: absolute; inset: 0; pointer-events: none; }
.gl { position: absolute; left: 0; right: 0; border-top: 1px dashed color-mix(in oklab, var(--border), transparent 40%); }
.gl.zero { border-top: 1px solid var(--border-soft); }
.gl span { position: absolute; right: calc(100% + 8px); top: -7px; font-size: 10px; color: var(--meta); font-variant-numeric: tabular-nums; }
.plot-cols { position: absolute; inset: 0; display: flex; }
.dcol { position: relative; flex: 1 1 0; min-width: 0; height: 100%; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 10px; }
@media (hover: hover) { .dcol:hover { background: color-mix(in oklab, var(--surface), transparent 45%); } }
.dcol:focus-visible { outline-offset: -2px; }
.bar-fill { position: absolute; left: 0; right: 0; margin-inline: auto; bottom: 0; width: min(48px, 58%); border-radius: 7px 7px 2px 2px; background: color-mix(in oklab, var(--accent), var(--bg) 55%); height: calc(var(--h, 0) * 1%); min-height: 3px; transform-origin: bottom; }
.dcol.peak .bar-fill { background: var(--accent); }
.dcol.zero .bar-fill { min-height: 2px; background: var(--border); }
.vlab { position: absolute; left: 0; right: 0; text-align: center; bottom: calc(var(--h, 0) * 1% + 5px); font-size: 11px; font-weight: 600; color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dcol.zero .vlab { display: none; }
.line-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.line-area { fill: color-mix(in oklab, var(--accent), transparent 86%); stroke: none; }
.line-stroke { fill: none; stroke: var(--accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.ldot { position: absolute; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--accent); transform: translate(-50%, 50%); }
.ldot.zero { width: 8px; height: 8px; border-width: 1.5px; border-color: var(--border); background: var(--surface); }
.dcol::after { content: attr(data-tip); position: absolute; bottom: calc(var(--h, 0) * 1% + 28px); left: 50%; transform: translateX(-50%) translateY(4px); background: var(--fg); color: var(--bg); font-size: 11px; line-height: 1.4; padding: 5px 10px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard); z-index: 6; }
@media (hover: hover) { .dcol:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); } }
.dcol:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }
.xrow { display: flex; margin-left: 36px; padding-top: 8px; }
.xcell { flex: 1 1 0; min-width: 0; text-align: center; display: flex; flex-direction: column; gap: 1px; }
.xcell b { font-size: 11px; font-weight: 500; color: var(--fg-2); }
.xcell span { font-size: 10px; color: var(--meta); font-variant-numeric: tabular-nums; }
.xcell.today b { color: var(--accent-ink); }
@media (max-width: 640px) {
  .plot { height: 156px; margin-left: 30px; }
  .xrow { margin-left: 30px; }
  .vlab { display: none; }
  .tstats { gap: 14px; }
  .tstat b { font-size: 19px; }
  .bar-fill { width: min(28px, 56%); }
}
@media (prefers-reduced-motion: no-preference) {
  .bar-fill { animation: growY .65s var(--ease-standard) both; animation-delay: calc(var(--ci, 0) * 40ms); }
  .line-stroke { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawLine .9s var(--ease-standard) .1s both; }
  .line-area { animation: fadeIn .8s var(--ease-standard) .45s both; }
  .ldot { animation: popDot .32s var(--ease-standard) both; animation-delay: calc(0.3s + var(--ci, 0) * 60ms); }
}
@keyframes growY { from { transform: scaleY(0.06); opacity: 0.35; } }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
@keyframes popDot { from { opacity: 0; transform: translate(-50%, 50%) scale(0.4); } }

/* ─── Toolbar / search / filter ─────────────────────────────────── */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.search { position: relative; flex: 1; min-width: 180px; max-width: 320px; }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--meta); pointer-events: none; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--bg); font-size: var(--text-sm); }
.search input:focus-visible { border-color: var(--accent); outline: none; box-shadow: var(--focus-ring); }
.filter-rail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.filter-rail::-webkit-scrollbar { display: none; }
.fchip { flex: none; padding: 5px 12px; border-radius: var(--radius-pill); border: 1px solid var(--border-soft); background: var(--bg); color: var(--fg-2); font-size: 12px; white-space: nowrap; }
.fchip:hover { border-color: var(--meta); }
.fchip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 500; }

/* ─── Job cards ─────────────────────────────────────────────────── */
.job-card { display: flex; gap: 14px; align-items: flex-start; background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: 16px; transition: box-shadow var(--motion-base) var(--ease-standard), border-color var(--motion-fast); }
@media (hover: hover) { .job-card:hover { box-shadow: var(--elev-raised); border-color: var(--border-soft); } }
.job-card.off { opacity: 0.72; }
.job-card .jc-main { flex: 1; min-width: 0; }
.jc-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.45; }
.jc-sub { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.jc-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.jc-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
.jc-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.score-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border-radius: var(--radius-pill); padding: 4px 11px; }
.jc-side .mini-ring { width: 52px; height: 52px; }
.mini-ring .ring-num { font-size: 15px; }
@media (max-width: 640px) {
  .job-card { flex-wrap: wrap; }
  .jc-side { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; }
}

/* ─── Match 布局 ────────────────────────────────────────────────── */
.match-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1080px) { .match-grid { grid-template-columns: minmax(0, 1fr); } }
.pick-list { display: flex; flex-direction: column; gap: 4px; }
.pick-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 12px; border: 1px solid transparent; }
.pick-item:hover { background: var(--surface); }
.pick-item.on { background: var(--accent-soft); border-color: color-mix(in oklab, var(--accent), transparent 78%); }
.pick-item .p-main { flex: 1; min-width: 0; }
.pick-item .p-t { font-size: 13px; font-weight: 600; line-height: 1.4; }
.pick-item .p-s { font-size: 12px; color: var(--muted); }
.pick-item.on .p-t { color: var(--accent-ink); }
.cond-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); }
.cond-row:last-child { border-bottom: 0; }
.cond-main { flex: 1; min-width: 0; }
.cond-k { font-size: 13px; color: var(--muted); }
.cond-v { font-size: 14px; font-weight: 500; line-height: 1.5; }
.cond-ref { font-size: 12px; color: var(--meta); margin-top: 3px; }
.good-list li, .gap-list li { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: 14px; line-height: 1.6; }
.good-list .ic { color: var(--success); margin-top: 4px; }
.gap-list .ic { color: var(--color-gap, var(--danger)); margin-top: 4px; }
.prepline { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border-soft); font-size: 14px; }
.prepline:last-child { border-bottom: 0; }
.prepline .pp-t { flex: 1; min-width: 0; }
.prepline .pp-h { font-size: 13px; color: var(--muted); }
details.cites { border: 1px solid var(--border-soft); border-radius: var(--radius-md); background: var(--surface-warm); }
details.cites summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-size: var(--text-sm); font-weight: 500; }
details.cites summary::-webkit-details-marker { display: none; }
details.cites summary .ic { transition: transform var(--motion-fast) var(--ease-standard); color: var(--meta); }
details.cites[open] summary .ic { transform: rotate(90deg); }
details.cites .cites-body { padding: 0 14px 12px; }
.ref { border-left: 2px solid var(--border); padding: 2px 0 2px 12px; margin: 8px 0; font-size: 13px; color: var(--fg-2); line-height: 1.65; }
.ref .ref-src { display: block; font-size: 12px; color: var(--meta); margin-top: 3px; }
.portfolio-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
.portfolio-row:last-child { border-bottom: 0; }
.rank-no { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); color: var(--fg-2); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.rank-no.top { background: var(--accent); color: var(--accent-on); }
.pr-main { flex: 1; min-width: 0; }
.pr-eff { text-align: right; flex: none; }
.pr-eff b { font-size: 14px; display: block; }
.pr-eff span { font-size: 11px; color: var(--meta); }
input[type="range"].range { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; cursor: pointer; }
input[type="range"].range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--border) var(--p, 50%)); }
input[type="range"].range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); box-shadow: var(--elev-thumb), 0 0 0 1px var(--border); margin-top: -8px; }
input[type="range"].range:focus-visible { outline: none; }
input[type="range"].range:focus-visible::-webkit-slider-thumb { box-shadow: var(--focus-ring); }

/* ─── 计划日历 ──────────────────────────────────────────────────── */
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1180px) { .cal-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 720px) { .cal-grid { grid-template-columns: minmax(0, 1fr); } }
.day { background: var(--surface-warm); border: 1px solid var(--border-soft); border-radius: 14px; padding: 10px; min-height: 96px; display: flex; flex-direction: column; gap: 8px; }
.day.today { border-color: color-mix(in oklab, var(--accent), transparent 45%); background: var(--accent-soft); }
.day-h { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.day-h b { font-size: 13px; font-weight: 600; }
.day-h span { font-size: 11px; color: var(--meta); }
.task { background: var(--bg); border: 1px solid var(--border-soft); border-radius: 10px; padding: 8px 9px; display: flex; flex-direction: column; gap: 5px; }
.task.done { opacity: 0.62; }
.task.done .t-title { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--muted); }
.task.overdue { border-color: color-mix(in oklab, var(--danger), transparent 60%); background: var(--danger-bg); }
.t-top { display: flex; align-items: flex-start; gap: 8px; }
.t-title { flex: 1; font-size: 13px; font-weight: 500; line-height: 1.45; min-width: 0; }
.t-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.t-meta .chip { font-size: 11px; padding: 1px 8px; }
.task .tcheck { width: 20px; height: 20px; }
.task .tcheck .ic { width: 11px; height: 11px; }
.jdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

/* ─── 看板 ──────────────────────────────────────────────────────── */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(258px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
@media (max-width: 760px) { .board { grid-auto-flow: row; grid-auto-columns: auto; overflow-x: visible; } }
.col { background: var(--surface-warm); border: 1px solid var(--border-soft); border-radius: 14px; padding: 10px; min-width: 0; }
.col-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 8px; }
.col-h b { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.col-h .cd { width: 8px; height: 8px; border-radius: 50%; }
.col-h span.num { font-size: 12px; color: var(--meta); }
.kcard { background: var(--bg); border: 1px solid var(--border-soft); border-radius: 12px; padding: 11px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; cursor: pointer; text-align: left; width: 100%; transition: box-shadow var(--motion-fast) var(--ease-standard); }
@media (hover: hover) { .kcard:hover { box-shadow: var(--elev-raised); } }
.kcard:last-child { margin-bottom: 0; }
.kc-top { display: flex; gap: 9px; align-items: center; }
.kc-t { font-size: 13px; font-weight: 600; line-height: 1.4; min-width: 0; }
.kc-s { font-size: 11px; color: var(--muted); }
.kc-meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ─── 时间线 ────────────────────────────────────────────────────── */
.tl { position: relative; padding-left: 24px; }
.tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--border-soft); border-radius: 2px; }
.tl-item { position: relative; padding: 0 0 14px; }
.tl-item:last-child { padding-bottom: 2px; }
.tl-item::before { content: ""; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.tl-item.past::before { border-color: var(--meta); }
.tl-t { font-size: 13px; font-weight: 500; line-height: 1.5; }
.tl-s { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* ─── 表格（管理端） ────────────────────────────────────────────── */
.tbl-wrap { overflow-x: auto; }
table.tbl { min-width: 640px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 500; color: var(--meta); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--border-soft); font-size: 13px; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr:hover td { background: var(--surface-warm); }
.tbl .t-j { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tbl .t-j b { font-size: 13px; font-weight: 600; display: block; line-height: 1.4; }
.tbl .t-j span { font-size: 12px; color: var(--muted); }

/* ─── 差异对照 / 改写 ───────────────────────────────────────────── */
.diff { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .diff { grid-template-columns: minmax(0, 1fr); } }
.diff-col { border: 1px solid var(--border-soft); border-radius: 12px; padding: 12px; background: var(--surface-warm); }
.diff-col .d-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--meta); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.diff-col p { font-size: 13px; line-height: 1.7; color: var(--fg-2); }
.diff-col.new { background: var(--success-bg); border-color: color-mix(in oklab, var(--success), transparent 62%); }
.diff-col.new p { color: var(--fg); }
.rw.accepted { border-color: color-mix(in oklab, var(--success), transparent 55%); }

/* ─── 权限门 / 其他 ─────────────────────────────────────────────── */
.gate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 56px 20px; }
.gate .g-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--muted); }
.gate .g-ic .ic { width: 30px; height: 30px; }
.gate h2 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; }
.gate p { font-size: 13px; color: var(--muted); max-width: 44ch; line-height: 1.7; }
.kv { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv-k { width: 96px; flex: none; color: var(--muted); font-size: 13px; }
.kv-v { flex: 1; min-width: 0; }
.setting-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
.setting-row:last-child { border-bottom: 0; }
.sr-main { flex: 1; min-width: 0; }
.sr-t { font-size: 14px; font-weight: 500; }
.sr-s { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.6; }
.quote { background: var(--surface-warm); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 12px 14px; font-size: 13px; color: var(--fg-2); line-height: 1.7; }
.dz { border: 1.5px dashed var(--border); border-radius: var(--radius-md); padding: 22px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--surface-warm); transition: border-color var(--motion-fast), background-color var(--motion-fast); }
.dz:hover { border-color: var(--accent); background: var(--accent-soft); }
.dz .dz-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: center; color: var(--fg-2); }
.dz b { font-size: 14px; font-weight: 600; }
.dz span { font-size: 12px; color: var(--muted); }
.progress { height: 8px; border-radius: 4px; background: var(--border-soft); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .2s linear; }
.budget-card { background: var(--surface-warm); border: 1px solid var(--border-soft); border-radius: 14px; padding: 14px; }
.chip-input { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 9px; background: var(--bg); }
.chip-input input { border: 0 !important; padding: 2px 4px !important; flex: 1; min-width: 90px; font-size: 13px; }
.chip-input input:focus-visible { box-shadow: none !important; }
.chip-input .tag button { border: 0; background: none; color: var(--meta); margin-left: 4px; cursor: pointer; }
.check-anim { animation: checkPop .5s var(--ease-standard); }
@keyframes checkPop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>

const agoFromDate = (md) => {
  const [m, d] = md.split('-').map(Number);
  let dt = new Date(TODAY.getFullYear(), m - 1, d);
  if (dt > TODAY) dt = new Date(TODAY.getFullYear() - 1, m - 1, d);
  return Math.max(0, Math.round((TODAY - dt) / 864e5));
};
const hoursIn = (days) => S.time.filter((e) => agoFromDate(e.date) < days).reduce((s, e) => s + e.h, 0);
const interviewsWon = () => S.apps.filter((a) => a.status === 'interview' || a.status === 'offer').length;
const openTasks = () => S.tasks.filter((t) => !t.done);
const nearDeadline = (days = 21) => S.jobs.filter((j) => !j.offline && j.type === 'public' && j.dl <= days);
const effScore = (days) => { const h = hoursIn(days); return h <= 0 ? null : (interviewsWon() / h * 10); };
const activeSuggestions = () => S.suggestions.filter((s) => !s.gone);

function ring(score, size = 120, label = '匹配分') {
  const sw = size > 80 ? 9 : 6, r = size / 2 - sw - 2, C = +(2 * Math.PI * r).toFixed(1), c = size / 2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${label} ${score} 分">
    <circle class="ring-track" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${sw}"/>
    <circle class="ring-val" data-ring="${score}" data-c="${C}" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/>
    <text class="ring-num" x="${c}" y="${c + (size > 80 ? 9 : 4)}" text-anchor="middle">${score}</text>
  </svg>`;
}
const meterRow = (label, weight, score) => `<div class="meter"><span class="m-label">${esc(label)}<span class="m-w">${weight}%</span></span><span class="m-track"><i data-w="${score}"></i></span><span class="m-val num">${score}</span></div>`;
const empty = (ic, title, sub, action = '') => `<div class="empty"><span class="e-ic">${icon(ic)}</span><strong>${esc(title)}</strong><p>${esc(sub)}</p>${action}</div>`;
const kv = (k, v) => `<div class="kv"><span class="kv-k">${esc(k)}</span><span class="kv-v">${v}</span></div>`;

const TITLES = { dashboard: '工作台', profile: '画像与证据', jobs: '岗位', match: '匹配与组合', plan: '计划与改写', apps: '投递跟踪', admin: '管理员岗位', settings: '设置与同步中心' };
const RENDERERS = {};
function currentView() { const h = location.hash.replace(/^#\/?/, ''); return TITLES[h] ? h : 'dashboard'; }
function render() {
  const v = currentView();

  const html = RENDERERS[v] ? RENDERERS[v]() : '';

function go(view) { location.hash = '#/' + view; }
window.addEventListener('hashchange', () => { scrollMem[S.view] = window.scrollY; render(); });

function afterRender() {
  const root = $('#view');
  $$('.view-enter > *', root).forEach((el, i) => el.style.setProperty('--i', Math.min(i, 8)));
  $$('[data-count]', root).forEach((el) => {
    const target = parseFloat(el.dataset.count), dec = el.dataset.dec === '1';
    const fmt = (x) => (dec ? x.toFixed(1) : String(Math.round(x)));
    if (RM) { el.textContent = fmt(target); return; }
    const t0 = performance.now(), dur = 750;
    (function tick(t) { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(target * e); if (p < 1) requestAnimationFrame(tick); })(t0);
  });
  $$('.ring-val[data-ring]', root).forEach((c) => {
    const score = +c.dataset.ring, C = +c.dataset.c;
    c.style.strokeDasharray = C;
    c.style.strokeDashoffset = RM ? C * (1 - score / 100) : C;
    if (!RM) requestAnimationFrame(() => { c.style.transition = 'stroke-dashoffset .9s var(--ease-standard)'; c.style.strokeDashoffset = C * (1 - score / 100); });
  });
  $$('.m-track i[data-w]', root).forEach((b) => {
    const w = b.dataset.w + '%'; b.style.width = RM ? w : '0%';
    if (!RM) requestAnimationFrame(() => { b.style.transition = 'width .8s var(--ease-standard)'; b.style.width = w; });
  });
}
function syncBadges() {
  const el = $('#sideSync'); if (!el) return;
  const { pending, failed, conflicts, running, last } = S.sync;
  const bad = failed + conflicts;
  el.classList.toggle('busy', running);
  el.classList.toggle('bad', !running && bad > 0);
  const txt = running ? '正在同步…' : bad > 0 ? `待同步 ${pending} · 失败 ${failed} · 冲突 ${conflicts}` : `已同步 · ${last}`;
  $('#sideSyncText').textContent = txt;
  const top = $('#topSync');
  if (top) {
    top.className = 'chip ' + (running ? 'chip-muted' : bad > 0 ? 'chip-warn' : 'chip-success');

/* ── Toast ── */
function toast(msg, type = 'ok', ms = 2800) {
  S.toastSeq++;
  const wrap = document.createElement('div');
  wrap.className = 'toast';
  const ic = type === 'ok' ? 'check-circle' : type === 'err' ? 'x-circle' : type === 'warn' ? 'alert-circle' : 'info';
  wrap.innerHTML = `<span class="t-${type}">${icon(ic)}</span><span>${msg}</span>`;
  $('#toasts').appendChild(wrap);
  setTimeout(() => { wrap.classList.add('out'); setTimeout(() => wrap.remove(), 200); }, ms);
}

/* ── Sheet 弹层 ── */
const sheetStack = [];
function openSheet(html, opts = {}) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sheet = document.createElement('div');
  sheet.className = 'sheet' + (opts.lg ? ' sheet-lg' : '');
  sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true');
  sheet.innerHTML = html;
  document.body.append(scrim, sheet);
  const entry = { scrim, sheet, onClose: opts.onClose };
  sheetStack.push(entry);
  scrim.addEventListener('click', () => closeSheet());
  const f = sheet.querySelector('button, [href], input, select, textarea');
  if (f) setTimeout(() => f.focus(), 60);
  return sheet;
}
function closeSheet() {
  const entry = sheetStack.pop(); if (!entry) return;
  const { scrim, sheet, onClose } = entry;
  scrim.classList.add('out'); sheet.classList.add('out');
  setTimeout(() => { scrim.remove(); sheet.remove(); }, 190);
  if (onClose) onClose();
}
function sheetHead(title, sub, opts = {}) {
  return `<div class="sheet-head"><div><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}</div>
    <button class="sheet-close" data-act="close-sheet" aria-label="关闭">${icon('x')}</button></div>`;
}
function confirmSheet({ title, body, ok = '确认', danger = false, onOk }) {
  openSheet(`${sheetHead(title, '')}
    <div class="sheet-body"><p class="small" style="color:var(--fg-2);line-height:1.7">${body}</p></div>
    <div class="sheet-foot"><button class="btn btn-secondary" data-act="close-sheet">取消</button>
    <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="confirm-ok">${esc(ok)}</button></div>`);
  ACTIONS['confirm-ok'] = () => { closeSheet(); setTimeout(() => onOk && onOk(), 20); };
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (sheetStack.length) closeSheet(); else closePops(); }
  if (e.key === 'Tab' && sheetStack.length) {
    const s = sheetStack[sheetStack.length - 1].sheet;
    const f = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', s).filter((el) => !el.disabled && el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }
});

/* ── 顶栏浮层 ── */
function closePops() { popsOpen.forEach((p) => p.remove()); popsOpen = []; $('#bellBtn').setAttribute('aria-expanded', 'false'); $('#avatarBtn').setAttribute('aria-expanded', 'false'); }

}
document.addEventListener('click', (e) => {

  const inPop = e.target.closest('.popover');
  const t = e.target.closest('[data-act]');
  if (btn) { openPop(btn.id === 'bellBtn' ? 'bell' : 'avatar'); return; }
  if (!inPop && !t) closePops();
  if (!t) return;
  const act = t.dataset.act;
  if (act.startsWith('pop-')) closePops();
  if (ACTIONS[act]) { e.preventDefault(); ACTIONS[act](t.dataset.id || '', t, e); }
});
document.addEventListener('input', (e) => {
  if (e.isComposing) return;

  if (INPUTS[t.dataset.input]) INPUTS[t.dataset.input](t.value, t, e);
});
document.addEventListener('change', (e) => {

document.addEventListener('submit', (e) => {

});

    const d = dOff(-i);
    out.push({ i, md: fmtMD(-i), wd: '周' + '日一二三四五六'[d.getDay()], today: i === 0,
      h: S.time.filter((e) => agoFromDate(e.date) === i).reduce((a, e) => a + e.h, 0) });
  }
  return out;
};

    if (!S.parse || S.parse.phase !== 'uploading') { clearInterval(tick); return; }

    if (S.parse.pct >= 100) { S.parse = { phase: 'parsing' }; clearInterval(tick); render();

  S.parse = { phase: 'done', added }; S.stale = true;
  closeSheet(); render();
  toast(`已确认：新增 ${added} 条待确认经历、更新 ${skills} 项技能证据`, 'ok', 3400);

ACTIONS['pick-job'] = (id) => { S.matchJob = id; const j = jobById(id); if (j && !j.analyzed) { ACTIONS['goto-match'](id); return; } render(); };

        <div class="setting-row"><div class="sr-main"><div class="sr-t">站内提醒</div><div class="sr-s">任务到期当天 09:00、面试提前 1 小时（可分别关闭）</div></div>
          <label class="switch"><input type="checkbox" data-change="set-flag" data-id="inApp" ${st.inApp ? 'checked' : ''} aria-label="站内提醒" /><span class="trk"></span></label></div>
        <div class="setting-row"><div class="sr-main"><div class="sr-t">任务提醒</div><div class="sr-s">默认到期当天 09:00，按用户时区调度</div></div>
          <label class="switch"><input type="checkbox" data-change="set-flag" data-id="taskRemind" ${st.taskRemind ? 'checked' : ''} aria-label="任务提醒" /><span class="trk"></span></label></div>
        <div class="setting-row"><div class="sr-main"><div class="sr-t">面试提醒</div><div class="sr-s">默认提前 1 小时</div></div>
          <label class="switch"><input type="checkbox" data-change="set-flag" data-id="interview" ${st.interview ? 'checked' : ''} aria-label="面试提醒" /><span class="trk"></span></label></div>
        <div class="setting-row"><div class="sr-main"><div class="sr-t">浏览器推送 ${pushChip}</div>
          <div class="sr-s">${st.push === 'granted' ? '系统通知已授权（演示环境未接入真实推送服务）' : st.push === 'denied' ? '授权被拒绝：站内提醒仍然可用，可随时在浏览器设置中恢复' : '需要你主动点击开启；不支持或拒绝时保留站内提醒'}</div>
          <div class="od-cluster" style="margin-top:8px">
            ${st.push === 'default' ? `<button class="btn btn-sm btn-primary" data-act="push-ask">开启浏览器推送</button><button class="btn btn-sm btn-secondary" data-act="push-deny">演示：模拟拒绝</button>` : `<button class="btn btn-sm btn-secondary" data-act="push-reset">重置授权状态</button>`}
          </div></div></div>
        <div class="setting-row"><div class="sr-main"><div class="sr-t">时区</div><div class="sr-s">服务端按 UTC 调度，这里保存你的展示时区</div></div>
          <div class="field" style="width:150px"><label class="visually-hidden" for="tzSel">时区</label>
          <select id="tzSel" data-change="set-tz"><option value="Asia/Shanghai" ${st.tz === 'Asia/Shanghai' ? 'selected' : ''}>Asia/Shanghai</option><option value="Asia/Singapore" ${st.tz === 'Asia/Singapore' ? 'selected' : ''}>Asia/Singapore</option><option value="UTC" ${st.tz === 'UTC' ? 'selected' : ''}>UTC</option></select></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 class="card-title">安装与离线</h2>${chip('可安装', 'chip-success', 'download')}</div>
        <div class="sr-s" style="line-height:1.8">在浏览器菜单中选择「安装应用 / 添加到主屏幕」即可作为 PWA 使用；离线时画像、经历、任务与投递记录可继续修改，恢复网络后同步。</div>
        <div class="banner" style="margin-top:10px">${icon('wifi-off')}<div>离线操作会进入待提交队列（当前 ${sy.pending} 项）；同步失败不会丢弃本地数据。</div></div>
      </section>
    </div>
    <div class="stack-cards">
      <section class="card">
        <div class="card-head"><div><h2 class="card-title">同步中心</h2><p class="card-sub">最后成功：${esc(sy.last)}</p></div>
          ${sy.running ? chip('进行中', 'chip-warn', 'refresh') : (sy.pending + sy.failed + sy.conflicts > 0 ? chip('有待处理', 'chip-warn', 'alert-circle') : chip('全部已同步', 'chip-success', 'check'))}</div>
        <div class="od-cluster" style="--od-gap:8px;margin-bottom:12px">
          ${chip('待同步 ' + sy.pending, 'chip-muted')}${chip('同步失败 ' + sy.failed, sy.failed ? 'chip-danger' : 'chip-muted')}${chip('版本冲突 ' + sy.conflicts, sy.conflicts ? 'chip-danger' : 'chip-muted')}
        </div>
        ${sy.running ? `<div class="progress" style="margin-bottom:12px"><i style="width:66%"></i></div>` : ''}
        <div class="od-cluster" style="--od-gap:8px">
          <button class="btn btn-primary btn-sm" data-act="sync-now" ${sy.running ? 'disabled' : ''}>${icon('sync')}立即同步</button>
          ${sy.conflicts ? `<button class="btn btn-secondary btn-sm" data-act="conflict-open">${icon('alert')}查看冲突（${sy.conflicts}）</button>` : ''}
          ${sy.failed ? `<button class="btn btn-secondary btn-sm" data-act="sync-now">重试失败项</button>` : ''}
        </div>
        <p class="hint" style="margin-top:10px">冲突不会静默覆盖：本地与服务器版本并列展示，由你选择；重新提交仍会检查版本。</p>
      </section>
      <section class="card">
        <div class="card-head"><h2 class="card-title">演示数据</h2></div>
        <p class="sr-s" style="line-height:1.8">本站使用虚构资料与演示身份；所有修改仅保存在本机内存中，刷新页面即恢复初始演示数据。</p>
        <div style="margin-top:12px"><button class="btn btn-danger-quiet btn-sm" data-act="reset-demo">${icon('refresh')}重置演示数据</button></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 class="card-title">关于</h2></div>
        ${kv('版本', 'v0.1 · 前端原型（框架与交互）')}
        ${kv('数据', '全部虚构，仅用于演示')}
        ${kv('后端', '未连接：解析、匹配、同步、推送均为前端模拟')}
        ${kv('规范', '接口契约以 OpenAPI 为唯一字段来源（后续与后端联调）')}
      </section>
    </div>
  </div>`;
};
ACTIONS['set-role'] = (id) => {
  S.role = id; render();
  toast(id === 'admin' ? '已切换到管理员演示身份' : '已切换到学生演示身份', 'ok');
};
INPUTS['set-flag'] = (v, el) => { const on = !!el.checked; S.settings[el.dataset.id] = on; toast((on ? '已开启' : '已关闭') + '：' + ({ inApp: '站内提醒', taskRemind: '任务提醒', interview: '面试提醒' }[el.dataset.id]), 'ok', 1800); };
INPUTS['set-tz'] = (v) => { S.settings.tz = v; render(); toast('时区已更新为 ' + v, 'ok'); };
ACTIONS['push-ask'] = async () => {
  if (!('Notification' in window)) { S.settings.push = 'denied'; render(); toast('当前浏览器不支持推送，已保留站内提醒', 'warn'); return; }
  try {
    const r = await Notification.requestPermission();
    S.settings.push = r === 'granted' ? 'granted' : r === 'denied' ? 'denied' : 'default';
    toast(r === 'granted' ? '系统通知已授权；真实推送需要后端 VAPID 支持（演示未接入）' : '未获得授权，站内提醒仍然可用', r === 'granted' ? 'ok' : 'warn', 4200);
  } catch (err) { S.settings.push = 'denied'; toast('授权请求被环境拦截，已保留站内提醒', 'warn'); }
  render();
};
ACTIONS['push-deny'] = () => { S.settings.push = 'denied'; render(); toast('演示：模拟拒绝授权，站内提醒不受影响', 'warn'); };
ACTIONS['push-reset'] = () => { S.settings.push = 'default'; render(); };
ACTIONS['sync-now'] = () => {
  if (S.sync.running) return;
  S.sync.running = true; render();
  setTimeout(() => {
    S.sync.running = false;
    S.sync.pending = 0; S.sync.failed = 0;
    S.sync.last = '刚刚';
    if (S.sync.conflicts > 0) toast('同步完成：1 项版本冲突待处理（不会静默覆盖）', 'warn', 4200);
    else toast('同步完成：全部操作已提交', 'ok');
    render();
  }, 1300);
};
ACTIONS['conflict-open'] = () => {
  const c = S.sync.conflict;
  openSheet(`${sheetHead('处理版本冲突', esc(c.entity))}
    <div class="sheet-body">
      <div class="banner banner-warn" style="margin-bottom:12px">${icon('alert')}<div>离线期间的修改与服务器更新冲突。两个版本并列展示，选择后才会提交；不会无条件覆盖。</div></div>
      <div class="diff">
        <div class="diff-col"><p class="d-label">本地版本 · ${esc(c.local.v)} · ${esc(c.local.t)}</p><p>${esc(c.local.text)}</p>
          <button class="btn btn-sm btn-primary" data-act="conflict-choose" data-id="local" style="margin-top:10px">选择本地版本</button></div>
        <div class="diff-col"><p class="d-label">服务器版本 · ${esc(c.server.v)} · ${esc(c.server.t)}</p><p>${esc(c.server.text)}</p>
          <button class="btn btn-sm btn-secondary" data-act="conflict-choose" data-id="server" style="margin-top:10px">选择服务器版本</button></div>
      </div>
    </div>
    <div class="sheet-foot"><button class="btn btn-secondary" data-act="close-sheet">稍后处理</button></div>`, { lg: true });
};
ACTIONS['conflict-choose'] = (which) => {
  S.sync.conflicts = 0; S.sync.pending = 0; S.sync.last = '刚刚';
  closeSheet(); render();
  toast(which === 'local' ? '已选择本地版本并重新提交（基础版本已更新为 v3）' : '已采用服务器版本；本地版本可在文件版本历史中找回', 'ok', 3800);
};
/* ───────────────────────── 启动 ───────────────────────── */
function boot() {
  const tl = document.querySelector('.topbar-left');
  if (tl && !$('#topSync')) tl.insertAdjacentHTML('beforeend', '<span class="chip chip-success" id="topSync">已同步</span>');
  const av = $('#avatarChar'); if (av) av.textContent = S.profile.avatar;
  const dot = $('#bellDot'); if (dot) dot.hidden = !!S.seenNotif;
  if (!location.hash) { try { history.replaceState(null, '', '#/dashboard'); } catch (e) { /* noop */ } }
  render();
}
boot();
</script>
</body>
</html>
