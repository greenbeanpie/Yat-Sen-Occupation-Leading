name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / typecheck + tests + dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run

  frontend:
    name: frontend / typecheck + lint + tests + build + dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run

  contracts:
    name: OpenAPI snapshot drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate backend snapshot
        working-directory: backend
        run: |
          npm ci
          npm run export:openapi
      - name: Regenerate frontend types
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Fail when the committed contract is stale
        run: git diff --exit-code -- backend/openapi/openapi.json frontend/src/api/schema.ts
